services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sentinel-jupyter

    user: root

    shm_size: "2gb"

    ports:
      - "8888:8888"

    volumes:
      - .:/home/jovyan/dpa_volume

    working_dir: /home/jovyan/dpa_volume

    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: "sentinel-local"
      PYTHONUNBUFFERED: "1"
      CHOWN_HOME: "yes"
      CHOWN_HOME_OPTS: "-R"
      GRANT_SUDO: "yes"
      SPARK_CONF_DIR: "/home/jovyan/dpa_volume/config"

    restart: unless-stopped

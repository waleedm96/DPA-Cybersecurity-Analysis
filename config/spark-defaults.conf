
# Loaded automatically through SPARK_CONF_DIR in docker-compose.yml.
# Restart the notebook kernel after changing startup settings here.
# Master and application
spark.master                           local[2]
spark.app.name                         SENTINEL-Volume-Analysis

# Leave memory for Python and file reads when Docker has about 8 GB.
spark.driver.memory                    4g
spark.driver.maxResultSize             2g
spark.driver.extraJavaOptions          -XX:+UseG1GC -XX:InitiatingHeapOccupancyPercent=45

# Shuffle and partitioning
spark.sql.shuffle.partitions           48
spark.sql.adaptive.enabled             true
spark.sql.adaptive.coalescePartitions.enabled true
spark.sql.adaptive.skewJoin.enabled    true

# File scan partitioning
spark.sql.files.maxPartitionBytes      67108864

# Parquet processing and intermediate output
spark.sql.parquet.compression.codec    snappy
spark.sql.parquet.filterPushdown       true
spark.sql.parquet.enableVectorizedReader true

# Join optimization
spark.sql.autoBroadcastJoinThreshold   33554432
spark.sql.broadcastTimeout             600

# Serialization and timestamps
spark.serializer                       org.apache.spark.serializer.KryoSerializer
spark.sql.session.timeZone             UTC
